[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-transcribe"
version = "0.1.0"
description = "Private local transcription provider and bounded Python client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
kilix-transcribe = "kilix_transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
